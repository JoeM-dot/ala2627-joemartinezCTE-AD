<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cliff Face | Joe M</title>
  <meta name="description" content="A randomly generated cliff face built from overlapping stone ledges." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="mountain-page">
    <header class="mountain-header">
      <a class="game-example-back" href="game-example.html">&larr; Return to the maze</a>
      <p class="game-kicker">Field Study // 01</p>
    </header>

    <section class="mountain-content" aria-labelledby="mountain-title">
      <div class="mountain-heading">
        <div>
          <p class="game-kicker">Procedural cliff face</p>
          <h1 id="mountain-title">The long ascent.</h1>
          <p class="mountain-description">A sheer face of stone, built from overlapping ledges.</p>
        </div>
        <div class="mountain-controls">
          <span class="mountain-seed" id="mountainSeed">SEED / --------</span>
          <button class="mountain-generate" id="generateMountain" type="button">Generate new cliff</button>
        </div>
      </div>

      <div class="mountain-frame">
        <canvas id="mountainCanvas" role="img"
          aria-label="A controllable stick figure beside a cliff; move with A and D, hold Q or E to grip with the left or right hand, drag the shoulder or elbow joints to move the arms, and drag the torso to swing while holding a grip. Releasing all holds causes a gravity-driven fall"></canvas>
        <span class="mountain-altitude" id="mountainAltitude">ALTITUDE 000 / 1000</span>
        <span class="mountain-caption">CLIFF FACE // CLIMBING ROUTE</span>
      </div>
    </section>
  </main>
  <script src="mountain.js"></script>
</body>

</html>
