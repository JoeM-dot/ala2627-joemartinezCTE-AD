<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maze Escape | Joe M</title>
  <meta name="description" content="A simple keyboard maze escape game by Joe Martinez." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="game-example-page">
    <header class="game-header">
      <a class="game-example-back" href="index.html">&larr; Back to overview</a>
      <p class="game-kicker">Game Example // 01</p>
    </header>

    <section class="game-layout" aria-labelledby="game-example-title">
      <div class="game-intro">
        <p class="game-kicker">Black / White / Escape</p>
        <h1 id="game-example-title">Find the way out.</h1>
        <p class="game-description">Guide the blue dot through each maze and reach the exit.</p>
        <div class="game-instructions">
          <span class="instruction-label">Controls</span>
          <span class="key-row"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span>
          <span class="instruction-or">or</span>
          <span class="key-row"><kbd>&uarr;</kbd><kbd>&larr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></span>
        </div>
      </div>

      <div class="game-stage">
        <div class="maze-meta">
          <span id="mazeNumber">Maze 1 / 5</span>
          <span id="moveCount">Moves: 0</span>
        </div>
        <div class="maze-shell">
          <div class="maze" id="maze" role="grid" aria-label="Maze game board" tabindex="0"></div>
          <div class="game-status" id="gameStatusBox" aria-live="polite" hidden>
            <span id="gameStatus">You win!</span>
            <button class="game-reset" id="resetGame" type="button">Next maze</button>
          </div>
        </div>
        <div class="maze-legend" aria-hidden="true">
          <span><i class="legend-player"></i>You</span>
          <span><i class="legend-exit"></i>Exit</span>
          <span><i class="legend-wall"></i>Wall</span>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
